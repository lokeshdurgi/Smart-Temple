name: Master Enterprise 5-Pillar QA Automation Pipeline (2000 Test Cases)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  unit-tests:
    name: Pillar 1 - Unit & API Integration Suite (400 Cases)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies
        run: |
          cd smart-temple-backend-main/test-suite
          npm install
      - name: Execute 400 Unit Test Cases
        run: |
          cd smart-temple-backend-main/test-suite
          npm run test:unit

  selenium-tests:
    name: Pillar 2 - Selenium Web E2E Suite (400 Cases)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies & Browsers
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable firefox
          cd smart-temple-backend-main/test-suite
          npm install
      - name: Execute 400 Selenium Web E2E Test Cases
        env:
          HEADLESS: "true"
          BASE_URL: "https://lokeshdurgi.github.io/Smart-Temple"
        run: |
          cd smart-temple-backend-main/test-suite
          npm run test:selenium

  appium-tests:
    name: Pillar 3 - Appium Android Mobile Suite (400 Cases)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install Appium & Dependencies
        run: |
          npm install -g appium
          appium driver install uiautomator2
          cd smart-temple-backend-main/test-suite
          npm install
      - name: Execute 400 Appium Mobile Test Cases
        run: |
          cd smart-temple-backend-main/test-suite
          npm run test:appium

  load-tests:
    name: Pillar 4 - Load & Performance Suite (400 Scenarios)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies
        run: |
          cd smart-temple-backend-main/test-suite
          npm install
      - name: Execute Baseline Load Test (100 VUs / 1 min / 400 Scenarios)
        run: |
          cd smart-temple-backend-main/test-suite
          npm run test:load

  security-tests:
    name: Pillar 5 - Defensive Security Audit Suite (400 Checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies
        run: |
          cd smart-temple-backend-main/test-suite
          npm install
      - name: Execute 400 Defensive Security Test Checks
        run: |
          cd smart-temple-backend-main/test-suite
          npm run test:security

  generate-consolidated-report:
    name: Consolidated 2,000 Test Case Excel & HTML Artifact Generator
    needs: [unit-tests, selenium-tests, appium-tests, load-tests, security-tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Dependencies
        run: |
          cd smart-temple-backend-main/test-suite
          npm install
      - name: Execute Master Test Suite & Generate Excel Report
        run: |
          cd smart-temple-backend-main/test-suite
          npm test
          npm run report:generate
      - name: Upload Comprehensive 2,000 Test Cases Excel & HTML Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Comprehensive-2000-QA-Execution-Report
          path: |
            smart-temple-backend-main/test-suite/reports/
          retention-days: 30
