name: Appium 2.x Android Mobile E2E Automation Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  mobile-e2e-tests:
    name: Execute Android Appium E2E Suite
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Install Appium & Dependencies
        run: |
          npm install -g appium
          cd appium-mobile-framework
          npm install

      - name: 4. Execute Mobile E2E Suite
        run: |
          cd appium-mobile-framework
          npm test || true

      - name: 5. Upload Mobile Execution Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appium-android-e2e-artifacts
          path: |
            appium-mobile-framework/excel/Mobile_E2E_Report.xlsx
            appium-mobile-framework/reports/
            appium-mobile-framework/screenshots/
            appium-mobile-framework/logs/
          retention-days: 30
