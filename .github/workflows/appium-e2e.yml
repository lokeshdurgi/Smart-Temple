name: Appium 2.x Android Mobile E2E Automation Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  mobile-e2e-tests:
    name: Execute Android Appium E2E Suite on Emulator
    runs-on: macos-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: 5. Install Appium 2.x & UiAutomator2 Driver
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: 6. Install Project Dependencies
        run: |
          cd appium-mobile-framework
          npm install

      - name: 7. Start Appium Server in Background
        run: |
          appium --log appium.log &
          sleep 5

      - name: 8. Create & Run Android Emulator (API 33 / Android 13)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: Pixel_6
          script: |
            adb devices
            cd appium-mobile-framework
            npm test || true

      - name: 9. Upload Mobile Execution Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appium-android-e2e-artifacts
          path: |
            appium-mobile-framework/excel/Mobile_E2E_Report.xlsx
            appium-mobile-framework/reports/
            appium-mobile-framework/screenshots/
            appium-mobile-framework/logs/
          retention-days: 30
