name: Selenium React E2E Automation Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * *' # Daily midnight run
  workflow_dispatch:

jobs:
  e2e-tests:
    name: Execute Cross-Browser Selenium Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'selenium-e2e-framework/package-lock.json'

      - name: 3. Install NPM Dependencies
        run: |
          cd selenium-e2e-framework
          npm ci || npm install

      - name: 4. Install & Configure Browsers (Chrome & Firefox)
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable firefox

      - name: 5. Run Selenium E2E Tests (Headless Mode)
        env:
          HEADLESS: "true"
          CROSS_BROWSER: ${{ matrix.browser }}
          BASE_URL: "https://react-shopping-cart-67954.firebaseapp.com"
        run: |
          cd selenium-e2e-framework
          npm run test || true

      - name: 6. Generate Reports Verification
        run: |
          cd selenium-e2e-framework
          ls -la excel/ || true
          ls -la reports/html/ || true

      - name: 7. Upload Execution Artifacts (Excel, HTML Reports, Screenshots, Logs)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-e2e-results-${{ matrix.browser }}
          path: |
            selenium-e2e-framework/excel/E2E_Report.xlsx
            selenium-e2e-framework/reports/
            selenium-e2e-framework/screenshots/
            selenium-e2e-framework/logs/
          retention-days: 30
